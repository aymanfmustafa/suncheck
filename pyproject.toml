[project]
name = "suncheck"
version = "0.0.1"
description = "How much sun does this spot really get: the sun's path for every month drawn over your own view, with the real horizon."
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy",
    "opencv-python-headless",
    "pillow",
    "pillow-heif",
    "exifread",
    "requests",
    "matplotlib",
    "astral",
    "meta-sam-parser>=0.1.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["suncheck"]
